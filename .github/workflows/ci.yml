name: Node.js CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test

      # ---------------------------------------------------------
      #ewman API test for /health
      # ---------------------------------------------------------
      - name: Run Newman API tests (/health)
        run: |
          newman run postman/health-check.json \
            -e postman/staging-environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export newman/newman-report.xml \
            --reporter-htmlextra-export newman/newman-report.html

      # ---------------------------------------------------------
      - name: Upload Newman test reports
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: newman/

      - name: Build
        run: npm run build

  deploy_staging:
    name: CD - Deploy to Staging (AWS CodeDeploy)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip application
        run: |
          zip -r app.zip . \
            -x ".git/*" \
            -x "node_modules/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-west-1

      - name: Upload bundle to S3
        run: |
          aws s3 cp app.zip s3://pulsedesk-codedeploy-artifacts-cjm/app.zip

      - name: Deploy via CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name PulseDeskApp \
            --deployment-group-name PulseDeskStaging \
            --s3-location bucket=pulsedesk-codedeploy-artifacts-cjm,key=app.zip,bundleType=zip