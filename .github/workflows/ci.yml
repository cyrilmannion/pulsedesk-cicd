name: Node.js CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy_staging:
    name: CD - Deploy to Staging (Simulated)
    runs-on: ubuntu-latest
    needs: test

    # Only deploy on push to staging branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    environment: "staging"

    steps:
      - name: Deploy to staging (simulated)
        run: |
          echo "Deploying to STAGING..."
          echo "In a full AWS account, this would trigger AWS CodeDeploy to a staging EC2 instance."
          echo "Deploy complete "

      - name: Health check (simulated)
        run: |
          echo "Running health checks..."
          echo "OK "

      - name: Rollback (simulated) if deployment fails
        if: failure()
        run: |
          echo "Deployment failed "
          echo "Rolling back to previous stable version (simulated) "